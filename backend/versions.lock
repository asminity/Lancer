# AUTONEX (PAG) Versions Lock
# Updated: 2026-10-03
OPENCODE_VERSION=2.0.22
OPENCODE_BINARY_SOURCE=npm/@opencode/cli/2.0.22
PAG_CTX_TIER=3
CONTEXT_CAP=128000

# Default models (0G Private Computer)
DEFAULT_BUILD_MODEL=0g/qwen3-coder-flash
DEFAULT_PLAN_MODEL=0g/glm-5.3-flash
DEFAULT_EXPLORE_MODEL=0g/qwen-flash

# The only supported model provider
PROVIDERS=zg_compute

# Resource optimization
AGENT_MEM_LIMIT=2g
LLMPROXY_MEM_LIMIT=128m
EGRESS_MEM_LIMIT=128m
SEARXNG_MEM_LIMIT=256m

DEVIATIONS=
- Target OS: Windows WSL2 Ubuntu (systemd-enabled native Docker 29.1.3 + compose v2.40.3)
- Storage directed to /mnt/d/AUTONEX to preserve C: drive capacity
- Agent memory reduced from 6g to 2g for low-resource PC
- Added rate limiting (30 req/min) to nginx proxy
- SearXNG secret moved from settings.yml to .env
- Fixed launcher hardcoded-index security bug (now dynamically finds deny block)
- Fixed context plugin double-mask bug (stored replacements instead of recomputing)
- Added bare-form deny policies for git push and git reset --hard
- Routed inference exclusively through the 0G Private Computer Router
