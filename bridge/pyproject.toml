[project]
name = "autonex-bridge"
version = "0.1.0"
description = "AUTONEX Bridge Server — gateway core & multi-agent swarm execution"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["autonex_bridge*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "autonex_bridge.main:app"

